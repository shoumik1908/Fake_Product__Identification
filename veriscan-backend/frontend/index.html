<!DOCTYPE html>
<html>
<head>
    <title>VeriScan AI</title>
</head>
<body style="font-family: Arial; text-align:center; margin-top:100px;">

    <h1>VeriScan AI</h1>

    <form id="uploadForm">
        <input type="text" id="product_id" placeholder="Enter Product ID" required><br><br>
        <input type="file" id="imageInput" required><br><br>
        <button type="submit">Verify Product</button>
    </form>

    <h2 id="result"></h2>

<script>
document.getElementById("uploadForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const productId = document.getElementById("product_id").value;
    const imageFile = document.getElementById("imageInput").files[0];

    const formData = new FormData();
    formData.append("product_id", productId);
    formData.append("image", imageFile);

    const response = await fetch("http://127.0.0.1:8000/verify", {
        method: "POST",
        body: formData
    });

    const data = await response.json();

    document.getElementById("result").innerHTML =
        `Prediction: ${data.prediction} <br> Confidence: ${data.confidence}`;
});
</script>

</body>
</html>
