name: Deploy Backend to Hugging Face
on:
  push:
    branches: [main]
    paths:
      - 'veriscan-backend/**'
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "bot@veriscan.ai"
          git config --global user.name "VeriScan Bot"
          git remote add space https://shoumik1908:$HF_TOKEN@huggingface.co/spaces/Shoumik1908/veriscan-backend
          git subtree push --prefix veriscan-backend space main
